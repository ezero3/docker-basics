services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://apptodo:todoapp@db:5432/todo_db
    depends_on:
      - db
  db:
    image: postgres:15.3
    environment:
      POSTGRES_USER: apptodo
      POSTGRES_PASSWORD: todoapp
      POSTGRES_DB: todo_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: